services:
  gitlab:
    image: gitlab/gitlab-ee:${GITLAB_VERSION:-19.2.2-ee.0}
    container_name: gitlab
    restart: unless-stopped
    hostname: ${GITLAB_HOST:-localhost}
    environment:
      TZ: ${TZ:-Asia/Taipei}
      GITLAB_ROOT_EMAIL: ${GITLAB_ROOT_EMAIL:-admin@example.com}
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?請先在 .env 設定 GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        # external_url 帶 port 時，容器內 nginx 就會聽這個 port，
        # 所以下面 ports 要對映成 8929:8929（不是 8929:80）
        external_url 'http://${GITLAB_HOST:-localhost}:${GITLAB_HTTP_PORT:-8929}'

        # 對外 SSH port，要和 ports 的 host port 一致，clone URL 才會正確
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        gitlab_rails['time_zone'] = '${TZ:-Asia/Taipei}'

        # --- 精簡設定：單機測試用，關掉吃資源又用不到的元件 ---
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        gitlab_kas['enable'] = false
        registry['enable'] = false
        gitlab_exporter['enable'] = false

        # puma 單進程模式，省下約 1GB RAM（正式環境請改成 2 以上）
        puma['worker_processes'] = 0
        sidekiq['max_concurrency'] = 5
        postgresql['shared_buffers'] = '256MB'
        postgresql['max_connections'] = 100

        # --- SMTP：要寄信（邀請、重設密碼）再打開 ---
        # gitlab_rails['smtp_enable'] = true
        # gitlab_rails['smtp_address'] = 'smtp.example.com'
        # gitlab_rails['smtp_port'] = 587
        # gitlab_rails['smtp_user_name'] = 'user@example.com'
        # gitlab_rails['smtp_password'] = 'change-me'
        # gitlab_rails['smtp_domain'] = 'example.com'
        # gitlab_rails['smtp_authentication'] = 'login'
        # gitlab_rails['smtp_enable_starttls_auto'] = true
        # gitlab_rails['gitlab_email_from'] = 'gitlab@example.com'

        # --- LDAP：要接公司內網 AD 再打開，填好下面欄位 ---
        # gitlab_rails['ldap_enabled'] = true
        # gitlab_rails['ldap_servers'] = {
        #   'main' => {
        #     'label' => 'LDAP',
        #     'host' => 'ldap.internal.example.com',
        #     'port' => 389,
        #     'uid' => 'sAMAccountName',
        #     'encryption' => 'plain',
        #     'bind_dn' => 'CN=svc-gitlab,CN=Users,DC=example,DC=com',
        #     'password' => 'change-me',
        #     'active_directory' => true,
        #     'base' => 'DC=example,DC=com'
        #   }
        # }
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      - "${GITLAB_SSH_PORT:-2224}:22"
    volumes:
      - ./data/config:/etc/gitlab
      - ./data/logs:/var/log/gitlab
      - ./data/data:/var/opt/gitlab
      - ./backups:/var/opt/gitlab/backups
    # GitLab 內含 PostgreSQL，/dev/shm 太小會啟動失敗
    shm_size: 256m
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 30s
      timeout: 30s
      retries: 10
      # 首次啟動要跑 migration，10 分鐘內不判定為 unhealthy
      start_period: 10m
    ulimits:
      nofile: 60000
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # 不需要 CI 就不用管它；要啟動時加 --profile runner
  gitlab-runner:
    image: gitlab/gitlab-runner:${RUNNER_VERSION:-latest}
    container_name: gitlab-runner
    restart: unless-stopped
    profiles: ["runner"]
    depends_on:
      - gitlab
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - ./runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
